# CD: deploy the Worker on every push to the default branch (currently `master`;
# `main` included so a future rename doesn't silently kill deploys).
# Requires two repo secrets: CLOUDFLARE_API_TOKEN and SMOKE_BYPASS_TOKEN — see worker/README.md.
name: Deploy

on:
  push:
    branches: [master, main]

permissions:
  contents: read

# Queue deploys, never cancel one mid-flight — a killed run could stop between
# applying migrations and deploying the code that matches them.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # npm ci runs third-party lifecycle scripts after this; don't leave the token in .git/config.
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run check
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply nem-api-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Cloudflare's edge bot/IP filtering 403s GitHub-hosted runners (datacenter
      # IPs) before requests ever reach the Worker (LAB-1760). A WAF custom rule
      # on the 27b.io zone SKIPs that filtering only for /health requests carrying
      # this secret header, so the check still exercises the real public route.
      # SMOKE_BYPASS_TOKEN must match the value in the WAF rule — see
      # worker/README.md "Deploy". --dump-header prints RESPONSE headers only
      # (cf-ray / cf-mitigated, for Security-Events triage on failure); never use
      # `curl -v` here, it would echo the request header — and the secret — into
      # the public run log.
      - name: Smoke-check /health
        env:
          SMOKE_BYPASS_TOKEN: ${{ secrets.SMOKE_BYPASS_TOKEN }}
        run: |
          : "${SMOKE_BYPASS_TOKEN:?repo secret SMOKE_BYPASS_TOKEN not set — see worker/README.md Deploy}"
          sleep 15
          curl --fail --silent --show-error --retry 5 --retry-delay 10 --retry-all-errors \
            --dump-header - \
            --header "X-Smoke-Bypass: ${SMOKE_BYPASS_TOKEN}" \
            https://nem.27b.io/health
