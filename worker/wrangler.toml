# nem.api modernization — single Worker (ingest + API + assets land here in later stages).
# workers.dev deploy is the dev environment; production routes/domains attach at cutover (LAB-422).
name = "nem-api"
main = "src/index.ts"
compatibility_date = "2026-07-01"
# Pinned so CI deploys need only CLOUDFLARE_API_TOKEN (no account lookup).
account_id = "a3ff5761a3414bbf10e94ef31ea6aa07"

# Dashboard static assets (LAB-419), served from this same Worker/zone — no
# separate Pages project, no CORS hop. Requests matching a file under public/
# are served as assets; everything else (including /api/v2/*) falls through to
# the fetch handler. public/assets/styles.css is BUILT (npm run build:css) and
# committed, same convention as the generated seed migration — the deploy
# pipeline stays a plain `wrangler deploy`.
[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "nem-api-db"
database_id = "f00b82f4-086b-44da-abfe-c44f44872a8d"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "ARCHIVE"
bucket_name = "nem-api-archive"

# Two schedules, dispatched in src/index.ts on the exact cron string:
#   */5        — SCADA CURRENT ingest (LAB-417): one file per 5-minute dispatch
#                interval, diffed against the `scrape` ledger.
#   11,26,...  — ARCHIVE daily backfill (LAB-420): must stay byte-identical to
#                BACKFILL_CRON in src/backfill.ts; offset so it never lands on
#                a */5 minute. Drains ~13 months of daily zips in ~a day, then
#                idles as a standing >2-day gap healer.
[triggers]
crons = ["*/5 * * * *", "11,26,41,56 * * * *"]
